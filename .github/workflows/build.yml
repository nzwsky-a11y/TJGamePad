name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 社区标准:自动装 Theos + Linux 工具链 + ldid + iOS SDK
      - uses: Randomblock1/theos-action@v1
        with:
          theos-path: ${{ github.workspace }}/theos

      - name: 编译
        run: |
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: TJGamePad-deb
          path: packages/*.deb
          if-no-files-found: error
